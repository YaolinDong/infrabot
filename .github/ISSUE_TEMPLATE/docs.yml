name: Documentation or website
description: Wrong, missing or unclear information on the website or in this repository.
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: URL or file path.
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: [English, 简体中文, Both]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
